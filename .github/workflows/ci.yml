# 푸시·PR마다 JS 문법 + index 정적 검사 (브라우저 E2E는 미포함)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke check
        run: node tools/smoke-check.cjs
